# Quasar 1 must resolve Vue 2 from its own flat dependency tree.
packages: []
nodeLinker: hoisted

overrides:
  '@types/minimatch': 5.1.2

patchedDependencies:
  '@quasar/app@2.4.4': patches/quasar-app+2.4.4.patch
  vue@2.7.16: patches/vue+2.7.16.patch
  vue-template-compiler@2.7.16: patches/vue-template-compiler+2.7.16.patch

allowBuilds:
  ant-design-vue: false
  bufferutil: false
  core-js: false
  cpu-features: false
  electron@45.2.1: true
  electron-winstaller: true
  highlight.js@9.18.5: false
  lzma-native: false
  ssh2: false
  utf-8-validate: false
