name: Coolma Tauri Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'tauri-v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-vue2-tauri
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Prepare sidecar runtime
        run: pnpm run prepare:sidecar

      - name: Build signed NSIS bundle
        run: pnpm exec tauri build --config src-tauri/tauri.updater.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Generate latest.json
        run: node scripts/make-updater-json.js --repo ${{ github.repository }} --tag tauri-latest --notes "Coolma Tauri 自动发布"

      - name: Publish rolling release
        working-directory: .
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view tauri-latest --repo "${{ github.repository }}" 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create tauri-latest --repo "${{ github.repository }}" --title "Coolma Tauri（滚动更新）" --notes "Tauri 桌面版自动发布通道，供 updater 读取 latest.json"
          }
          $assets = @("desktop-vue2-tauri/latest.json") + (Get-ChildItem "desktop-vue2-tauri/src-tauri/target/release/bundle/nsis/*_x64-setup.exe*").FullName
          gh release upload tauri-latest $assets --clobber --repo "${{ github.repository }}"
