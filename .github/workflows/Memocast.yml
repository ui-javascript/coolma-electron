name: Coolma Desktop Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies and build desktop-vue2
        run: |
          corepack pnpm install --frozen-lockfile
          cd desktop-vue2
          corepack yarn install --frozen-lockfile
          corepack yarn run build-publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: coolma-windows
          path: desktop-vue2/dist/electron/Packaged/*
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies and build desktop-vue2
        run: |
          corepack pnpm install --frozen-lockfile
          cd desktop-vue2
          corepack yarn install --frozen-lockfile
          corepack yarn run build-publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: coolma-linux
          path: desktop-vue2/dist/electron/Packaged/*
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies and build desktop-vue2
        run: |
          corepack pnpm install --frozen-lockfile
          cd desktop-vue2
          corepack yarn install --frozen-lockfile
          corepack yarn run build-publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: coolma-macos
          path: desktop-vue2/dist/electron/Packaged/*
          if-no-files-found: error
