# 由 `yarn blog:init-ci` 自动生成；可手工修改但下次 init-ci 会被覆盖。
#
# ⚠️ 安全说明（2026-11-21 审计后加固）：
#   公开仓库的 workflow artifact 任何 GitHub 用户都可以下载，
#   而本工作流上传的是个人笔记数据库 memocast.db。
#   因此 job 加了仓库可见性守卫：仅私有仓库才允许执行，
#   公开仓库下手动触发也会直接跳过，防止笔记库被公开下载。
name: blog-db-upload

on:
  workflow_dispatch:
    inputs:
      kb_guid:
        description: 'kb_guid（可选，留空导出全部）'
        required: false
        type: string
        default: ''

jobs:
  upload:
    # 安全守卫：公开仓库一律不执行（artifact 会被任何人下载）
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Decode db from base64 secret
        env:
          MEMOCAST_DB_BASE64: ${{ secrets.MEMOCAST_DB_BASE64 }}
        run: |
          if [ -z "$MEMOCAST_DB_BASE64" ]; then
            echo "::error::secrets.MEMOCAST_DB_BASE64 未配置"
            exit 1
          fi
          mkdir -p .cache
          echo "$MEMOCAST_DB_BASE64" | base64 -d > .cache/memocast.db
          ls -la .cache/memocast.db

      - name: Sanity-check the db
        run: |
          node -e '
            const fs = require("fs");
            const buf = fs.readFileSync(".cache/memocast.db");
            const sig = buf.slice(0, 16).toString("ascii");
            if (!sig.startsWith("SQLite format 3")) {
              console.error("::error::文件不是合法 SQLite：", JSON.stringify(sig));
              process.exit(1);
            }
            console.log("[ok] SQLite 文件签名正确，大小:", buf.length, "bytes");
          '

      - name: Upload as artifact (retained 14 days)
        uses: actions/upload-artifact@v4
        with:
          name: memocast-db
          path: .cache/memocast.db
          retention-days: 14
          if-no-files-found: error
