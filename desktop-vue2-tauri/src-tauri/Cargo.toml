[package]
name = "coolma-tauri"
version = "2026.11.4"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
percent-encoding = "2"
# 数据库改用 rusqlite 取代渲染层的 sql.js 全库快照：bundled 直接编译 SQLite 源码，
# 不依赖系统里有没有 sqlite3.dll，安装包也不会带外部依赖。
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "2", features = ["devtools"] }
keyring = { version = "3.6", default-features = false, features = ["windows-native", "apple-native"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# native-tls 走系统 TLS，避免引入 rustls 的 ring（本机 MSVC 编译 ring 的 C 源码会失败）。
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
tempfile = "3"

# DPAPI 解封（读 Electron safeStorage 留的旧密钥），只用到 CryptUnprotectData/LocalFree。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
] }
