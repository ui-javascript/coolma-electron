packages:
  - desktop-vue3
  - desktop-vue2
  - libs-muya
  - tpl-vuepress1-voding-muya
  - tpl-vitepress1-teek-muya

# Quasar v1 and Electron packaging expect a flat node_modules layout.
nodeLinker: hoisted

overrides:
  '@types/minimatch': 5.1.2

patchedDependencies:
  vue@2.7.16: desktop-vue2/patches/vue+2.7.16.patch
  vue-template-compiler@2.7.16: desktop-vue2/patches/vue-template-compiler+2.7.16.patch

allowBuilds:
  ant-design-vue: false
  bufferutil: false
  core-js: false
  cpu-features: false
  electron-winstaller: true
  esbuild@0.14.7: true
  esbuild@0.21.5: true
  highlight.js@9.18.5: false
  lzma-native: false
  ssh2: false
  utf-8-validate: false
  vuepress@1.9.10: false
