<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- CSP_PLACEHOLDER -->
    <title>Coolma Vue3</title>
    <style>
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      body {
        overflow: hidden;
        background: #f5f6f8;
        color: #1f2329;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      #loadingPage {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f5f6f8;
      }
      .loading-logo {
        display: flex;
        width: 56px;
        height: 56px;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        box-shadow: 0 12px 30px rgb(37 99 235 / 25%);
        color: #fff;
        font-size: 26px;
        font-weight: 700;
      }
      .loading-title {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }
      .loading-desc {
        font-size: 12px;
        color: #8a9099;
      }
      .loading-bar {
        width: 132px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: #e4e7ed;
      }
      .loading-bar::after {
        display: block;
        width: 44%;
        height: 100%;
        border-radius: inherit;
        background: #2563eb;
        animation: loading-slide 1.1s ease-in-out infinite;
        content: "";
      }
      @keyframes loading-slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loadingPage">
      <div class="loading-logo">C</div>
      <div class="loading-title">COOLMA VUE3</div>
      <div class="loading-bar"></div>
      <div class="loading-desc">正在启动桌面应用...</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
